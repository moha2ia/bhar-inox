<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Illustration de démonstration — garde-corps inox de terrasse">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46525E"/>
      <stop offset="1" stop-color="#8B99A3"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6ECEB"/>
      <stop offset="0.45" stop-color="#A7B4B2"/>
      <stop offset="1" stop-color="#778684"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E7D7B"/>
      <stop offset="0.3" stop-color="#C9D2D1"/>
      <stop offset="0.6" stop-color="#8D9C9A"/>
      <stop offset="1" stop-color="#5F6E6C"/>
    </linearGradient>
    <linearGradient id="deckFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4046"/>
      <stop offset="1" stop-color="#262B30"/>
    </linearGradient>
  </defs>

  <!-- Ciel / horizon urbain -->
  <rect width="1600" height="760" fill="url(#sky)"/>
  <!-- Skyline lointaine -->
  <g fill="#2F3A44" opacity="0.55">
    <rect x="0" y="520" width="180" height="240"/>
    <rect x="200" y="460" width="140" height="300"/>
    <rect x="360" y="540" width="200" height="220"/>
    <rect x="590" y="430" width="120" height="330"/>
    <rect x="740" y="500" width="180" height="260"/>
    <rect x="950" y="450" width="150" height="310"/>
    <rect x="1130" y="530" width="210" height="230"/>
    <rect x="1370" y="470" width="230" height="290"/>
  </g>
  <g fill="#262F38" opacity="0.7">
    <rect x="90" y="580" width="110" height="180"/>
    <rect x="420" y="600" width="160" height="160"/>
    <rect x="640" y="560" width="90" height="200"/>
    <rect x="1000" y="590" width="130" height="170"/>
    <rect x="1420" y="560" width="180" height="200"/>
  </g>

  <!-- Dalle de terrasse -->
  <rect y="760" width="1600" height="440" fill="url(#deckFloor)"/>
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#4A545C" stroke-width="4"/>
  <g stroke="#31383E" stroke-width="2">
    <line x1="0" y1="840" x2="1600" y2="840"/>
    <line x1="0" y1="940" x2="1600" y2="940"/>
    <line x1="0" y1="1060" x2="1600" y2="1060"/>
    <line x1="180" y1="1200" x2="260" y2="760"/>
    <line x1="620" y1="1200" x2="660" y2="760"/>
    <line x1="1080" y1="1200" x2="1080" y2="760"/>
    <line x1="1440" y1="1200" x2="1400" y2="760"/>
  </g>

  <!-- Garde-corps : lisse continue -->
  <rect x="60" y="300" width="1480" height="34" rx="16" fill="url(#rail)"/>
  <rect x="60" y="326" width="1480" height="8" rx="4" fill="#5F6E6C" opacity="0.8"/>

  <!-- Sous-lisse -->
  <rect x="60" y="470" width="1480" height="12" rx="6" fill="#8D9C9A"/>

  <!-- Fillants verticaux -->
  <g fill="url(#post)">
    <rect x="140" y="334" width="20" height="430"/>
    <rect x="360" y="334" width="20" height="430"/>
    <rect x="580" y="334" width="20" height="430"/>
    <rect x="800" y="334" width="20" height="430"/>
    <rect x="1020" y="334" width="20" height="430"/>
    <rect x="1240" y="334" width="20" height="430"/>
    <rect x="1440" y="334" width="20" height="430"/>
  </g>

  <!-- Câbles tendus -->
  <g stroke="#B7C1C0" stroke-width="4" opacity="0.9">
    <line x1="60" y1="500" x2="1540" y2="500"/>
    <line x1="60" y1="560" x2="1540" y2="560"/>
    <line x1="60" y1="620" x2="1540" y2="620"/>
    <line x1="60" y1="680" x2="1540" y2="680"/>
    <line x1="60" y1="740" x2="1540" y2="740"/>
  </g>

  <!-- Pieds de fixation -->
  <g fill="#5F6E6C">
    <rect x="128" y="748" width="44" height="18" rx="3"/>
    <rect x="348" y="748" width="44" height="18" rx="3"/>
    <rect x="568" y="748" width="44" height="18" rx="3"/>
    <rect x="788" y="748" width="44" height="18" rx="3"/>
    <rect x="1008" y="748" width="44" height="18" rx="3"/>
    <rect x="1228" y="748" width="44" height="18" rx="3"/>
    <rect x="1428" y="748" width="44" height="18" rx="3"/>
  </g>

  <!-- Main courante angulaire à droite -->
  <g>
    <rect x="60" y="292" width="1480" height="10" rx="5" fill="#D7DEDD" opacity="0.8"/>
  </g>

  <!-- Étiquette -->
  <g>
    <rect x="40" y="1080" width="640" height="76" fill="#17191B" opacity="0.85"/>
    <rect x="40" y="1080" width="6" height="76" fill="#1716A5"/>
    <text x="76" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#9AA8A6">ILLUSTRATION DE DÉMONSTRATION</text>
    <text x="76" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2" fill="#5C6C6A">GARDE-CORPS INOX — PHOTOGRAPHIE AUTHENTIQUE À FOURNIR PAR BHAR INOX</text>
  </g>
</svg>
