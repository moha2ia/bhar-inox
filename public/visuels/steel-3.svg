<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Illustration de démonstration — verrière d'atelier en profilés inox">
  <defs>
    <linearGradient id="v-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3138"/>
      <stop offset="1" stop-color="#1E2227"/>
    </linearGradient>
    <linearGradient id="v-glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#B9C6D4"/>
      <stop offset="0.5" stop-color="#7C90A8"/>
      <stop offset="1" stop-color="#3E4C66"/>
    </linearGradient>
    <linearGradient id="v-frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D2D1"/>
      <stop offset="0.5" stop-color="#778684"/>
      <stop offset="1" stop-color="#A7B4B2"/>
    </linearGradient>
    <linearGradient id="v-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5148"/>
      <stop offset="1" stop-color="#3B352E"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#v-wall)"/>

  <!-- Sol béton -->
  <rect y="1000" width="1600" height="200" fill="#262B30"/>
  <line x1="0" y1="1000" x2="1600" y2="1000" stroke="#3A4249" stroke-width="3"/>

  <!-- Poutre bois apparente -->
  <rect x="0" y="90" width="1600" height="46" fill="url(#v-beam)"/>
  <g stroke="#2E2924" stroke-width="3">
    <line x1="120" y1="90" x2="120" y2="136"/>
    <line x1="420" y1="90" x2="420" y2="136"/>
    <line x1="720" y1="90" x2="720" y2="136"/>
    <line x1="1020" y1="90" x2="1020" y2="136"/>
    <line x1="1320" y1="90" x2="1320" y2="136"/>
  </g>

  <!-- Lanterneau supérieur -->
  <g>
    <rect x="200" y="160" width="1200" height="150" fill="url(#v-glass)" opacity="0.92"/>
    <rect x="200" y="160" width="1200" height="150" fill="none" stroke="url(#v-frame)" stroke-width="14"/>
    <line x1="500" y1="160" x2="500" y2="310" stroke="url(#v-frame)" stroke-width="10"/>
    <line x1="800" y1="160" x2="800" y2="310" stroke="url(#v-frame)" stroke-width="10"/>
    <line x1="1100" y1="160" x2="1100" y2="310" stroke="url(#v-frame)" stroke-width="10"/>
  </g>

  <!-- Verrière verticale à structure fine -->
  <g>
    <rect x="200" y="340" width="1200" height="620" fill="url(#v-glass)" opacity="0.88"/>
    <rect x="200" y="340" width="1200" height="620" fill="none" stroke="url(#v-frame)" stroke-width="18"/>

    <!-- Montants fins -->
    <g stroke="url(#v-frame)" stroke-width="9">
      <line x1="440" y1="340" x2="440" y2="960"/>
      <line x1="680" y1="340" x2="680" y2="960"/>
      <line x1="920" y1="340" x2="920" y2="960"/>
      <line x1="1160" y1="340" x2="1160" y2="960"/>
    </g>

    <!-- Traverse imposte -->
    <line x1="200" y1="560" x2="1400" y2="560" stroke="url(#v-frame)" stroke-width="9"/>

    <!-- Porte coulissante intégrée -->
    <g>
      <rect x="935" y="575" width="210" height="385" fill="#141A22" opacity="0.55"/>
      <rect x="935" y="575" width="210" height="385" fill="none" stroke="#D7DEDD" stroke-width="5"/>
      <rect x="1120" y="740" width="10" height="90" rx="5" fill="#E6ECEB"/>
    </g>

    <!-- Reflets -->
    <polygon points="300,340 470,340 340,960 200,960" fill="#FFFFFF" opacity="0.10"/>
    <polygon points="560,340 660,340 480,960 420,960" fill="#FFFFFF" opacity="0.07"/>
  </g>

  <!-- Plante en pot devant la verrière -->
  <g>
    <path d="M1460 1000 l14 -90 h52 l14 90 z" fill="#3B4249"/>
    <path d="M1500 910 q-70 -90 -30 -170 q70 60 30 170" fill="#44544E"/>
    <path d="M1500 910 q-100 -40 -90 -120 q84 16 90 120" fill="#51635B"/>
    <path d="M1500 910 q60 -80 30 -160 q-64 60 -30 160" fill="#3D4C47"/>
  </g>

  <!-- Suspension luminaire discrète -->
  <g opacity="0.9">
    <line x1="360" y1="136" x2="360" y2="240" stroke="#575049" stroke-width="4"/>
    <path d="M320 240 h80 l-14 40 h-52 z" fill="#20262B" stroke="#575049" stroke-width="3"/>
    <circle cx="360" cy="290" r="9" fill="#E8E4D8" opacity="0.9"/>
  </g>

  <!-- Étiquette -->
  <g>
    <rect x="40" y="1080" width="660" height="76" fill="#17191B" opacity="0.85"/>
    <rect x="40" y="1080" width="6" height="76" fill="#1716A5"/>
    <text x="76" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#9AA8A6">ILLUSTRATION DE DÉMONSTRATION</text>
    <text x="76" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2" fill="#5C6C6A">VERRIÈRE INOX — PHOTOGRAPHIE AUTHENTIQUE À FOURNIR PAR BHAR INOX</text>
  </g>
</svg>
