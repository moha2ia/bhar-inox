<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Illustration de démonstration — atelier de menuiserie inox BHAR INOX">
  <defs>
    <linearGradient id="at-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3036"/>
      <stop offset="1" stop-color="#1E2227"/>
    </linearGradient>
    <linearGradient id="at-bench" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A545C"/>
      <stop offset="0.5" stop-color="#3A4249"/>
      <stop offset="1" stop-color="#2E363D"/>
    </linearGradient>
    <linearGradient id="at-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D2D1"/>
      <stop offset="0.4" stop-color="#8D9C9A"/>
      <stop offset="0.8" stop-color="#B7C1C0"/>
      <stop offset="1" stop-color="#778684"/>
    </linearGradient>
    <linearGradient id="at-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B99A3"/>
      <stop offset="1" stop-color="#5A6A78"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#at-wall)"/>

  <!-- Poutres de toiture -->
  <g stroke="#333B42" stroke-width="12">
    <line x1="0" y1="120" x2="1600" y2="40"/>
    <line x1="0" y1="220" x2="1600" y2="140"/>
    <line x1="0" y1="320" x2="1600" y2="240"/>
  </g>

  <!-- Baie vitrée atelier -->
  <g>
    <rect x="960" y="180" width="520" height="500" fill="url(#at-window)" opacity="0.9"/>
    <rect x="960" y="180" width="520" height="500" fill="none" stroke="#454F58" stroke-width="16"/>
    <line x1="1220" y1="180" x2="1220" y2="680" stroke="#454F58" stroke-width="10"/>
    <line x1="960" y1="430" x2="1480" y2="430" stroke="#454F58" stroke-width="10"/>
    <!-- Silhouette skyline à travers la verrière -->
    <g fill="#3A4C66" opacity="0.6">
      <rect x="1000" y="520" width="80" height="160"/>
      <rect x="1100" y="480" width="60" height="200"/>
      <rect x="1270" y="500" width="90" height="180"/>
      <rect x="1390" y="540" width="60" height="140"/>
    </g>
  </g>

  <!-- Sol atelier -->
  <rect y="680" width="1600" height="520" fill="#262B30"/>
  <line x1="0" y1="680" x2="1600" y2="680" stroke="#3A4249" stroke-width="4"/>
  <g stroke="#20262B" stroke-width="3">
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="0" y1="920" x2="1600" y2="920"/>
    <line x1="300" y1="1200" x2="380" y2="680"/>
    <line x1="900" y1="1200" x2="920" y2="680"/>
    <line x1="1420" y1="1200" x2="1400" y2="680"/>
  </g>

  <!-- Établi principal -->
  <g>
    <rect x="120" y="470" width="720" height="36" fill="url(#at-bench)"/>
    <rect x="150" y="506" width="26" height="300" fill="#333B42"/>
    <rect x="780" y="506" width="26" height="300" fill="#333B42"/>
    <rect x="150" y="700" width="656" height="18" fill="#2A3138"/>
  </g>

  <!-- Barres de profilés inox sur l'établi -->
  <g>
    <rect x="160" y="430" width="560" height="16" rx="4" fill="url(#at-steel)"/>
    <rect x="200" y="404" width="480" height="16" rx="4" fill="url(#at-steel)" opacity="0.9"/>
    <rect x="250" y="378" width="380" height="16" rx="4" fill="url(#at-steel)" opacity="0.8"/>
    <!-- Tubes carrés empilés au sol -->
    <rect x="880" y="620" width="300" height="18" fill="url(#at-steel)"/>
    <rect x="900" y="596" width="260" height="18" fill="url(#at-steel)" opacity="0.9"/>
    <rect x="920" y="572" width="220" height="18" fill="url(#at-steel)" opacity="0.8"/>
  </g>

  <!-- Poste à souder -->
  <g>
    <rect x="1180" y="760" width="180" height="140" rx="8" fill="#333B42"/>
    <rect x="1196" y="784" width="90" height="50" rx="4" fill="#1716A5" opacity="0.8"/>
    <circle cx="1320" cy="800" r="10" fill="#8D9C9A"/>
    <rect x="1210" y="900" width="14" height="90" fill="#20262B"/>
    <rect x="1320" y="900" width="14" height="90" fill="#20262B"/>
  </g>

  <!-- Chariot à roulettes -->
  <g>
    <rect x="620" y="800" width="220" height="90" rx="6" fill="#3A4249"/>
    <circle cx="660" cy="910" r="18" fill="#20262B" stroke="#4A545C" stroke-width="4"/>
    <circle cx="800" cy="910" r="18" fill="#20262B" stroke="#4A545C" stroke-width="4"/>
    <rect x="640" y="780" width="180" height="14" fill="url(#at-steel)" opacity="0.9"/>
  </g>

  <!-- Panneau mural outils -->
  <g>
    <rect x="60" y="180" width="300" height="260" fill="#333B42" stroke="#4A545C" stroke-width="4"/>
    <g fill="#8D9C9A">
      <rect x="84" y="210" width="14" height="90"/>
      <rect x="120" y="210" width="14" height="70"/>
      <rect x="156" y="210" width="14" height="100"/>
      <rect x="192" y="210" width="14" height="60"/>
      <rect x="228" y="210" width="14" height="84"/>
    </g>
    <g fill="#6E7D7B">
      <rect x="84" y="330" width="70" height="14"/>
      <rect x="84" y="364" width="90" height="14"/>
      <rect x="84" y="398" width="60" height="14"/>
    </g>
  </g>

  <!-- Étiquette -->
  <g>
    <rect x="40" y="1080" width="680" height="76" fill="#17191B" opacity="0.85"/>
    <rect x="40" y="1080" width="6" height="76" fill="#1716A5"/>
    <text x="76" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#9AA8A6">ILLUSTRATION DE DÉMONSTRATION</text>
    <text x="76" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2" fill="#5C6C6A">ATELIER — PHOTOGRAPHIE AUTHENTIQUE À FOURNIR PAR BHAR INOX</text>
  </g>
</svg>
