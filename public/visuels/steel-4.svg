<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Illustration de démonstration — balustrade de cage d'escalier en inox">
  <defs>
    <linearGradient id="s-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242A30"/>
      <stop offset="1" stop-color="#181B20"/>
    </linearGradient>
    <linearGradient id="s-step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A545C"/>
      <stop offset="0.5" stop-color="#333B42"/>
      <stop offset="1" stop-color="#28303A"/>
    </linearGradient>
    <linearGradient id="s-hand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDF2F1"/>
      <stop offset="0.35" stop-color="#B4C0BE"/>
      <stop offset="0.7" stop-color="#849391"/>
      <stop offset="1" stop-color="#D0D8D7"/>
    </linearGradient>
    <linearGradient id="s-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2CBCA"/>
      <stop offset="1" stop-color="#6E7D7B"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#s-wall)"/>

  <!-- Sol -->
  <rect y="1060" width="1600" height="140" fill="#20252B"/>
  <line x1="0" y1="1060" x2="1600" y2="1060" stroke="#39424A" stroke-width="3"/>

  <!-- Volée inférieure (marches droites) -->
  <g>
    <rect x="120" y="940" width="360" height="26" fill="url(#s-step)"/>
    <rect x="120" y="966" width="360" height="94" fill="#262E36"/>
    <rect x="200" y="840" width="360" height="26" fill="url(#s-step)"/>
    <rect x="200" y="866" width="360" height="76" fill="#262E36"/>
    <rect x="280" y="740" width="360" height="26" fill="url(#s-step)"/>
    <rect x="280" y="766" width="360" height="76" fill="#262E36"/>
    <rect x="360" y="640" width="360" height="26" fill="url(#s-step)"/>
    <rect x="360" y="666" width="360" height="76" fill="#262E36"/>
  </g>

  <!-- Volée hélicoïdale supérieure -->
  <g>
    <rect x="620" y="540" width="300" height="24" fill="url(#s-step)" transform="rotate(-8 620 540)"/>
    <rect x="720" y="450" width="280" height="24" fill="url(#s-step)" transform="rotate(-14 720 450)"/>
    <rect x="810" y="360" width="260" height="24" fill="url(#s-step)" transform="rotate(-20 810 360)"/>
    <rect x="890" y="280" width="240" height="24" fill="url(#s-step)" transform="rotate(-26 890 280)"/>
    <rect x="960" y="200" width="220" height="24" fill="url(#s-step)" transform="rotate(-30 960 200)"/>
  </g>

  <!-- Balustrade : câbles et lisses -->
  <g stroke="url(#s-bar)" stroke-width="6" fill="none" opacity="0.95">
    <path d="M140 900 Q 340 850 500 780"/>
    <path d="M220 800 Q 420 750 580 680"/>
    <path d="M300 700 Q 500 650 660 580"/>
    <path d="M380 600 Q 580 550 740 480"/>
    <path d="M460 500 Q 660 450 820 380"/>
    <path d="M540 410 Q 740 360 900 290"/>
    <path d="M620 320 Q 820 270 980 200"/>
  </g>

  <!-- Main courante miroir -->
  <g fill="url(#s-hand)">
    <rect x="130" y="856" width="400" height="18" rx="9" transform="rotate(12 130 856)"/>
    <rect x="310" y="656" width="420" height="18" rx="9" transform="rotate(12 310 656)"/>
    <rect x="490" y="456" width="430" height="18" rx="9" transform="rotate(13 490 456)"/>
    <rect x="640" y="286" width="360" height="18" rx="9" transform="rotate(-18 640 286)"/>
  </g>

  <!-- Poteaux de départ -->
  <g fill="url(#s-bar)">
    <rect x="140" y="560" width="18" height="420"/>
    <rect x="500" y="360" width="18" height="560"/>
    <rect x="1000" y="120" width="18" height="260"/>
  </g>
  <circle cx="149" cy="552" r="14" fill="#D7DEDD"/>
  <circle cx="509" cy="352" r="14" fill="#D7DEDD"/>
  <circle cx="1009" cy="112" r="14" fill="#D7DEDD"/>

  <!-- Reflet sol poli -->
  <ellipse cx="700" cy="1110" rx="520" ry="26" fill="#4A545C" opacity="0.25"/>

  <!-- Suspension puits de lumière -->
  <g opacity="0.8">
    <line x1="1120" y1="0" x2="1120" y2="150" stroke="#4A545C" stroke-width="4"/>
    <circle cx="1120" cy="170" r="26" fill="#E8E4D8" opacity="0.25"/>
    <circle cx="1120" cy="170" r="12" fill="#E8E4D8" opacity="0.9"/>
  </g>

  <!-- Étiquette -->
  <g>
    <rect x="40" y="1080" width="660" height="76" fill="#17191B" opacity="0.85"/>
    <rect x="40" y="1080" width="6" height="76" fill="#1716A5"/>
    <text x="76" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#9AA8A6">ILLUSTRATION DE DÉMONSTRATION</text>
    <text x="76" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2" fill="#5C6C6A">BALUSTRADE INOX — PHOTOGRAPHIE AUTHENTIQUE À FOURNIR PAR BHAR INOX</text>
  </g>
</svg>
